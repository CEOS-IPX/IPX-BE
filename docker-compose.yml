# ============================================================
# 로컬 개발용 docker-compose.yml
# ============================================================
# 공유 인프라를 Spring 레포 한 곳에서 관리:
#   - postgres   : Spring + Python 두 서버가 공유
#   - redis      : Spring 전용
#   - opensearch : Python 전용
#
# Spring/Python 앱은 컨테이너로 띄우지 않고 각자 IDE에서 로컬 실행
# ============================================================

services:

  # ===== PostgreSQL + pgvector =====
  postgres:
    image: pgvector/pgvector:pg17
    container_name: patent-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patent_db}
      POSTGRES_USER: ${POSTGRES_USER:-ipx_patent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipx_patent_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: patent-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localpassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== OpenSearch =====
  opensearch:
    build:
      context: ./infra/opensearch
      dockerfile: Dockerfile
    container_name: patent-opensearch
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - ./infra/opensearch/synonyms_patent.txt:/usr/share/opensearch/config/analysis/synonyms_patent.txt
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  opensearch_data: