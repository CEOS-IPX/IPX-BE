# ============================================================
# Rate Limit Zones (DDOS 방어 목적)
# ============================================================
# Nginx의 rate limit는 IP당 제한 → DDOS 방어용.
# 사용자별 LLM 호출 제한은 Spring 애플리케이션 레벨에서 별도 처리.

# 일반 요청: 사실상 무제한 (DDOS만 차단)
limit_req_zone $binary_remote_addr zone=general:10m rate=500r/s;

# 검색 관련: 정상 사용에서 초당 10회 넘을 일 없음
limit_req_zone $binary_remote_addr zone=search:10m rate=10r/s;

# Rate limit 초과 시 429 반환 (기본 503 대신 표준 코드)
limit_req_status 429;

# ============================================================
# HTTP → HTTPS 리다이렉트
# ============================================================
server {
    listen 80;
    server_name api.ipx-patent.com;

    # Certbot ACME 챌린지 (SSL 발급/갱신)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS 메인 서버
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name api.ipx-patent.com;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.ipx-patent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ipx-patent.com/privkey.pem;

    # SSL 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 요청 본문 크기 제한
    client_max_body_size 10M;

    # 로그
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ============================================================
    # Rate limit 초과 시 JSON 응답
    # ============================================================
    error_page 429 = @rate_limit_error;
    location @rate_limit_error {
        default_type application/json;
        return 429 '{"success":false,"data":null,"error":{"code":"RQ001","message":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요."}}';
    }

    # ============================================================
    # 검색 API (LLM 호출 포함 → 더 긴 타임아웃 + 엄격한 rate limit)
    # ============================================================
    location /api/searches {
        # IP당 초당 10회, burst 10 허용 (DDOS 방어 목적)
        # 사용자별 세부 제한은 Spring에서 처리
        limit_req zone=search burst=10 nodelay;

        proxy_pass http://app-spring:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM(Gemini + Claude) 호출 + 벡터 검색 포함되므로 타임아웃 길게
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ============================================================
    # 진보성 분석 API (LLM 호출)
    # ============================================================
    location ~ ^/api/cases/[0-9]+/inventive-step-analysis$ {
        limit_req zone=search burst=10 nodelay;

        proxy_pass http://app-spring:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ============================================================
    # 신규성 분석 API (LLM 호출)
    # ============================================================
    location ~ ^/api/cases/[0-9]+/novelty-analysis$ {
        limit_req zone=search burst=10 nodelay;

        proxy_pass http://app-spring:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ============================================================
    # 헬스체크
    # ============================================================
    location /health {
        proxy_pass http://app-spring:8080/actuator/health;
        access_log off;
    }

    # ============================================================
    # 일반 API (인증, 회원, 프로젝트 등)
    # ============================================================
    location / {
        # 일반 요청은 초당 500회까지 허용
        limit_req zone=general burst=1000 nodelay;

        proxy_pass http://app-spring:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}