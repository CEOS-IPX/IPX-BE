# ============================================================
# Nginx 리버스 프록시 설정
# ============================================================
# 모든 사용자 요청은 Spring 서버(app-spring:8080)로 전달
# Python 서버(app-python:8000)는 내부에서 Spring이 호출하므로 외부 노출 안 함
# ============================================================

# DDOS 공격 방지
# 일반 요청: 사실상 무제한
limit_req_zone $binary_remote_addr zone=general:10m rate=500r/s;

# 검색: 회사 단위라도 안 걸리도록
limit_req_zone $binary_remote_addr zone=search:10m rate=50r/s;

# ============================================================
# HTTP → HTTPS 리다이렉트
# ============================================================
server {
    listen 80;
    # IPX 서버 도메인
    server_name api.ipx-patent.com;

    # Certbot ACME 챌린지 (SSL 발급/갱신)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS 메인 서버
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name api.ipx-patent.com;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.ipx-patent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ipx-patent.com/privkey.pem;

    # SSL 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 요청 본문 크기 제한
    client_max_body_size 10M;

    # 로그
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ============================================================
    # 검색 API (LLM 호출 포함 -> 더 긴 타임아웃 + 엄격한 rate limit)
    # ============================================================
    location /api/search {
        # IP당 초당 5회, burst 100 허용
        limit_req zone=search burst=100 nodelay;

        proxy_pass http://app-spring:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM(Gemini + Claude) 호출 + 벡터 검색까지 포함되므로
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ============================================================
    # 헬스체크
    # ============================================================
    location /health {
        proxy_pass http://app-spring:8080/actuator/health;
        access_log off;
    }

    # ============================================================
    # 일반 API (인증, 회원, 프로젝트 등)
    # ============================================================
    location / {
        # 일반 요청은 초당 1000회까지 허용
        limit_req zone=general burst=1000 nodelay;

        proxy_pass http://app-spring:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}