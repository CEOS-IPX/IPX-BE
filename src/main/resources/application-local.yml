spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/patent_db
    username: ${POSTGRES_USER:ipx_patent_user}
    password: ${POSTGRES_PASSWORD:local_dev_postgres_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: INFO
    ceos.ipx: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    try-it-out-enabled: true

jwt:
  secret: ${JWT_SECRET:ipx-local-jwt-secret-key-for-development-1234567890}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
