spring:
  application:
    name: ipx-be

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

search-server:
  base-url: ${SEARCH_SERVER_URL:http://localhost:8000}
  timeout-seconds: 120

server:
  port: 8080
