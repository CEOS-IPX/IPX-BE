spring:
  application:
    name: ipx-be

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

search-server:
  base-url: ${SEARCH_SERVER_URL:http://localhost:8000}
  timeout-seconds: 120

server:
  port: 8080

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI}
    auth-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
    scope:
      - openid
      - email
      - profile

frontend:
  oauth:
    google-callback-uri: ${FRONTEND_GOOGLE_OAUTH_CALLBACK_URI:http://localhost:3000/oauth/google/callback}
    allowed-redirect-uris:
      - http://localhost:3000/oauth/google/callback
      - https://ipx-patent.com/oauth/google/callback
      - https://www.ipx-patent.com/oauth/google/callback